<div class="container">

  <h1>📚 Pila de Libros</h1>

  <div class="form-container">

    <h2>Agregar nuevo libro</h2>

    <form (ngSubmit)="addBook()">

      <div class="form-group">
        <label>Nombre del libro</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="newBook.name"
          placeholder="Ej: El Hobbit"
        >
      </div>

      <div class="form-group">
        <label>ISBN</label>
        <input
          type="text"
          name="isbn"
          [(ngModel)]="newBook.isbn"
          placeholder="Ej: 978-0547928227"
        >
      </div>

      <div class="form-group">
        <label>Autor</label>
        <input
          type="text"
          name="author"
          [(ngModel)]="newBook.author"
          placeholder="Ej: J.R.R. Tolkien"
        >
      </div>

      <div class="form-group">
        <label>Editorial</label>
        <input
          type="text"
          name="editorial"
          [(ngModel)]="newBook.editorial"
          placeholder="Ej: HarperCollins"
        >
      </div>

      <button type="submit">
        Agregar libro
      </button>

    </form>

  </div>


  <div class="stack-container">

    <h2>Libros en la pila</h2>

    <div class="stack">

      <div class="book" *ngFor="let book of books">

        <h3>{{ book.name }}</h3>

        <p><strong>ISBN:</strong> {{ book.isbn }}</p>

        <p><strong>Autor:</strong> {{ book.author }}</p>

        <p><strong>Editorial:</strong> {{ book.editorial }}</p>

      </div>

    </div>

  </div>

</div>
