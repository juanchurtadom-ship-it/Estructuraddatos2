<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/">Food<span>Flow</span></a>
    <p class="eyebrow">QUÉ BUENO TENERTE DE VUELTA</p>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Ingresa a tu cuenta para continuar.</p>

    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="tu@correo.com"
        autocomplete="email"
        required
        email
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Mínimo 6 caracteres"
        autocomplete="current-password"
        required
        minlength="6"
      />

      @if (errorMessage) {
        <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <button
  type="submit"
  [disabled]="loginForm.invalid || loading"
>
  {{ loading ? 'Ingresando...' : 'Entrar a FoodFlow' }}
</button>
    </form>

    <p class="switch-link">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    <a class="back-link" routerLink="/">← Volver al inicio</a>
  </section>
</main>
