
<div class="contenedor">

  <header class="encabezado">
    <h1>GIPHY Explorer</h1>
    <p>Encuentra tus GIFs favoritos</p>
  </header>

  <section class="buscador">
    <input
      type="text"
      [(ngModel)]="termino"
      (keyup.enter)="buscar()"
      placeholder="¿Qué GIF estás buscando?"
    />

    <button (click)="buscar()" [disabled]="cargando">
      {{ cargando ? 'Buscando...' : 'Buscar GIFs' }}
    </button>
  </section>

  <p *ngIf="cargando" class="mensaje">
    Cargando GIFs...
  </p>

  <p *ngIf="error" class="error">
    {{ error }}
  </p>

  <section class="galeria">
    <div class="gif" *ngFor="let gif of gifs">
      <img
        [src]="gif.images.fixed_height.url"
        [alt]="gif.title"
      />
    </div>
  </section>

  <p *ngIf="!cargando && gifs.length === 0 && !error"
     class="mensaje">
    ¡Busca algo para descubrir GIFs!
  </p>

</div>
